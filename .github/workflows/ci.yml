name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Toolchain (Node ${{ matrix.node-version }} + PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, tokenizer
          ini-values: zend.assertions=1, assert.exception=1
          coverage: none

      - name: Verify PHP Patch Version (Threat Model F1 - PHP2Shell Mitigation)
        run: |
          php -r "
          \$v = PHP_VERSION;
          \$minVersions = [
              '8.2' => '8.2.35',
              '8.3' => '8.3.36',
              '8.4' => '8.4.27',
              '8.5' => '8.5.12',
          ];
          \$minor = PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;
          if (!isset(\$minVersions[\$minor])) {
              fwrite(STDERR, \"PHP \$v (minor \$minor) is not in the allowlist of verified branches. Rejecting unrecognized PHP minor version (fail-closed).\n\");
              exit(1);
          }
          if (version_compare(\$v, \$minVersions[\$minor], '<')) {
              fwrite(STDERR, \"PHP \$v is vulnerable to PHP2Shell (CVE-2026-109618, CVE-2026-109619). Minimum patched version for PHP \$minor is {\$minVersions[\$minor]}.\n\");
              exit(1);
          }
          "

      - name: Verify PHP Version Check Fails Closed (Threat Model F1 Test)
        run: |
          php -r "
          function evaluatePhpVersion(string \$v, string \$minor, array \$minVersions): array {
              if (!isset(\$minVersions[\$minor])) {
                  return [false, 'unknown_branch'];
              }
              if (version_compare(\$v, \$minVersions[\$minor], '<')) {
                  return [false, 'vulnerable_patch'];
              }
              return [true, 'safe'];
          }

          \$minVersions = [
              '8.2' => '8.2.35',
              '8.3' => '8.3.36',
              '8.4' => '8.4.27',
              '8.5' => '8.5.12',
          ];

          // 1. Cabang minor tidak dikenal WAJIB gagal-tertutup (fail-closed)
          assert(evaluatePhpVersion('8.1.30', '8.1', \$minVersions) === [false, 'unknown_branch'], 'PHP 8.1 harus ditolak');
          assert(evaluatePhpVersion('7.4.33', '7.4', \$minVersions) === [false, 'unknown_branch'], 'PHP 7.4 harus ditolak');
          assert(evaluatePhpVersion('8.6.0', '8.6', \$minVersions) === [false, 'unknown_branch'], 'PHP 8.6 harus ditolak');
          assert(evaluatePhpVersion('9.0.0', '9.0', \$minVersions) === [false, 'unknown_branch'], 'PHP 9.0 harus ditolak');

          // 2. Cabang minor dikenal dengan versi di bawah batas aman WAJIB ditolak
          assert(evaluatePhpVersion('8.2.34', '8.2', \$minVersions) === [false, 'vulnerable_patch'], 'PHP 8.2.34 harus ditolak');
          assert(evaluatePhpVersion('8.3.35', '8.3', \$minVersions) === [false, 'vulnerable_patch'], 'PHP 8.3.35 harus ditolak');

          // 3. Cabang minor dikenal dengan versi aman WAJIB diizinkan
          assert(evaluatePhpVersion('8.2.35', '8.2', \$minVersions) === [true, 'safe'], 'PHP 8.2.35 harus diizinkan');
          assert(evaluatePhpVersion('8.3.36', '8.3', \$minVersions) === [true, 'safe'], 'PHP 8.3.36 harus diizinkan');
          assert(evaluatePhpVersion('8.4.27', '8.4', \$minVersions) === [true, 'safe'], 'PHP 8.4.27 harus diizinkan');
          assert(evaluatePhpVersion('8.5.12', '8.5', \$minVersions) === [true, 'safe'], 'PHP 8.5.12 harus diizinkan');

          fwrite(STDOUT, \"Verifikasi PHP version check fail-closed berhasil dibuktikan.\n\");
          "

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies (Strict Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Full Lint & Semantic Error Verification
        run: pnpm lint

      - name: Run Node.js Tests (Compiler & Runtime)
        run: pnpm test

      - name: Run PHP Tests (Adapter Laravel & Security Audits)
        run: php -d zend.assertions=1 -d assert.exception=1 packages/adapter-laravel/test/AdapterTest.php
