name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Toolchain (Node ${{ matrix.node-version }} + PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, tokenizer
          ini-values: zend.assertions=1, assert.exception=1
          coverage: none

      - name: Verify PHP Patch Version (Threat Model F1 - PHP2Shell Mitigation)
        run: php -r "version_compare(PHP_VERSION, '8.2.20', '>=') || (fwrite(STDERR, 'PHP ' . PHP_VERSION . ' is vulnerable to PHP2Shell/CVE-2024-4577.\n') && exit(1));"

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies (Strict Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Full Lint & Semantic Error Verification
        run: pnpm lint

      - name: Run Node.js Tests (Compiler & Runtime)
        run: pnpm test

      - name: Run PHP Tests (Adapter Laravel & Security Audits)
        run: php -d zend.assertions=1 -d assert.exception=1 packages/adapter-laravel/test/AdapterTest.php
